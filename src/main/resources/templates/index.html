<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orange Pi Monitor</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #0f172a; color: #f8fafc; text-align: center; padding-top: 40px; margin: 0; }
        .dashboard { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; max-width: 900px; margin: 0 auto; padding: 0 20px; }
        .card { background: #1e293b; padding: 25px; border-radius: 16px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); width: 240px; text-align: left; }
        .card h3 { margin: 0 0 10px 0; color: #94a3b8; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.05em; }
        .card .value { font-size: 1.8rem; font-weight: bold; color: #38bdf8; }

        .card.cpu-temp-card h3, .card.cpu-temp-card .value { color: #f97316; }
        .card.cpu-usage-card h3, .card.cpu-usage-card .value { color: #e11d48; }

        .system-time { margin-bottom: 30px; font-size: 1.1rem; color: #64748b; transition: color 0.3s; }
        .system-time.error { color: #ef4444; }
        h1 { margin-bottom: 5px; color: #f8fafc; }

        .progress-container { background: #334155; border-radius: 8px; height: 12px; margin-top: 15px; overflow: hidden; }
        .progress-bar { height: 100%; width: 0; transition: width 0.5s ease; }

        .progress-bar.cpu-bar { background: #e11d48; }
        .progress-bar.mem-bar { background: #38bdf8; }

        .mem-details { margin-top: 5px; font-size: 0.85rem; color: #64748b; display: flex; justify-content: space-between; }
    </style>
</head>
<body>
<h1>Orange Pi Server Monitor</h1>
<div class="system-time" id="status-container">Server Time: <span id="time">Connecting...</span></div>

<div class="dashboard">
    <div class="card cpu-temp-card">
        <h3>CPU Temperature</h3>
        <div class="value" id="cpu-temp">--.- °C</div>
    </div>

    <div class="card cpu-usage-card">
        <h3>CPU Load</h3>
        <div class="value"><span id="cpu-usage-txt">0.0</span> %</div>
        <div class="progress-container">
            <div class="progress-bar cpu-bar" id="cpu-bar"></div>
        </div>
    </div>

    <div class="card">
        <h3>RAM Usage</h3>
        <div class="value" id="mem-percent">0.0 %</div>
        <div class="progress-container">
            <div class="progress-bar mem-bar" id="mem-bar"></div>
        </div>
        <div class="mem-details">
            <span id="mem-used">0 MB</span>
            <span id="mem-total">0 MB</span>
        </div>
    </div>
</div>

<script>
    // Кэшируем ссылки на элементы один раз при загрузке страницы
    const elTime = document.getElementById('time');
    const elStatusContainer = document.getElementById('status-container');
    const elCpuTemp = document.getElementById('cpu-temp');
    const elCpuUsageTxt = document.getElementById('cpu-usage-txt');
    const elCpuBar = document.getElementById('cpu-bar');
    const elMemPercent = document.getElementById('mem-percent');
    const elMemUsed = document.getElementById('mem-used');
    const elMemTotal = document.getElementById('mem-total');
    const elMemBar = document.getElementById('mem-bar');

    let eventSource = null;

    function connect() {
        if (eventSource !== null) {
            eventSource.close();
        }

        eventSource = new EventSource('/api/sse-stream');

        // Сбрасываем статус ошибки при восстановлении соединения
        eventSource.onopen = () => {
            elStatusContainer.classList.remove('error');
        };

        eventSource.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);

                elTime.innerText = data.timestamp;
                elCpuTemp.innerText = data.cpuTemp;

                elCpuUsageTxt.innerText = data.cpuUsage.toFixed(1);
                elCpuBar.style.width = Math.min(Math.max(data.cpuUsage, 0), 100) + '%';

                elMemPercent.innerText = data.memory.percentUsed.toFixed(1) + ' %';
                elMemUsed.innerText = data.memory.usedMb + ' MB';
                elMemTotal.innerText = data.memory.totalMb + ' MB';
                elMemBar.style.width = Math.min(Math.max(data.memory.percentUsed, 0), 100) + '%';
            } catch (err) {
                console.error("Ошибка парсинга данных SSE:", err);
            }
        };

        eventSource.onerror = () => {
            elStatusContainer.classList.add('error');
            elTime.innerText = 'Connection lost. Reconnecting...';

            eventSource.close();
            setTimeout(connect, 3000);
        };
    }

    connect();
</script>
</body>
</html>
